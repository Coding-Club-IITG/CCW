version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb-server
    # The --replSet flag tells MongoDB to start as a replica set named "rs0"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ccw
    healthcheck:
      test: echo "db.runCommand('ping')" | mongosh localhost/test --quiet
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
