version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb-server
    # The --replSet flag tells MongoDB to start as a replica set named "rs0"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (!db.hello().isWritablePrimary) quit(1);"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "27017:27017"
    restart: unless-stopped
