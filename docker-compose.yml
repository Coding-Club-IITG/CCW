version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: project-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: project-mongo
    # The --replSet flag tells MongoDB to start as a replica set named "rs0"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    restart: unless-stopped
